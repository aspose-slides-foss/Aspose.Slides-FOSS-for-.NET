name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/Aspose.Slides.Foss.Tests --no-build --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/Aspose.Slides.Foss.IntegrationTests --no-build --configuration Release --verbosity normal

      # Conformance tests assert on the produced .pptx package — its XML, its relationships, its
      # content types and its schema validity — rather than on values read back through the library.
      # A test that calls the library to check the library cannot see a writer defect at all.
      - name: Run conformance tests
        run: dotnet test tests/Aspose.Slides.Foss.ConformanceTests --no-build --configuration Release --verbosity normal
