name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test tests/Aspose.Slides.Foss.Tests --no-build --configuration Release --verbosity normal

      - name: Run integration tests
        run: dotnet test tests/Aspose.Slides.Foss.IntegrationTests --no-build --configuration Release --verbosity normal

      # Conformance tests assert on the produced .pptx package — its XML, its relationships, its
      # content types and its schema validity — rather than on values read back through the library.
      # They currently report known defects in the writers, so this step reports without failing the
      # build. Make it blocking (drop continue-on-error) as soon as the suite is green.
      - name: Run conformance tests
        continue-on-error: true
        run: dotnet test tests/Aspose.Slides.Foss.ConformanceTests --no-build --configuration Release --verbosity normal
