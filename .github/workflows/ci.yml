name: CI

# Every action below is pinned to the commit SHA of a release rather than to its tag. A tag is a
# mutable pointer: whoever controls the action's repository can move `v7` to different code at any
# time, and that code then runs inside this workflow with this workflow's token and this
# repository's checkout. A SHA cannot be moved. The tag each SHA corresponded to when it was pinned
# is written next to it so the pin can be read and bumped by a human.

on:
  # The push trigger is deliberately unfiltered: work happens on branches before it becomes a pull
  # request, and a workflow that only runs on `main` cannot tell you whether a branch is good until
  # after it has been merged. Every branch builds, so the answer arrives while the change is still
  # being written. `pull_request` stays scoped to `main`, which is the branch a merge would change.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs this one and refuses to publish if any of it fails, so the artefact
  # that is pushed is the one these jobs built and inspected rather than a rebuild nothing tested.
  workflow_call:
    outputs:
      version:
        description: The version that was packed, as the project declares it.
        value: ${{ jobs.package.outputs.version }}
      package_id:
        description: The package identifier that was packed.
        value: ${{ jobs.package.outputs.package_id }}

# The workflow only reads the repository. Publishing is a separate, deliberate act; nothing here
# needs write access to anything.
permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant — but a second push to
# the same *tag* does not, because a release must not be cancelled halfway. `github.ref` is
# `refs/tags/...` on a tag push and `refs/heads/...` otherwise, so the expression is false only for
# tags. `startsWith`, not `contains`: a branch called `fix/refs/tags-parsing` would match `contains`.
#
# The literal `ci-` prefix is not cosmetic. Under `workflow_call`, `github.workflow` resolves to the
# CALLER's workflow name, so without the prefix this group could evaluate to the same string as the
# calling release workflow's own group — and the caller would then be queued behind a job it is
# itself waiting for, until the job timeout.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact worth having about the other two, so let them finish.
      fail-fast: false
      matrix:
        # The library has no platform-specific code, but "no platform-specific code" is a claim,
        # and writing a package on a case-sensitive file system with forward slashes is exactly
        # where such a claim breaks. All three platforms GitHub hosts are run.
        #
        # There is no target-framework axis, and that is deliberate. The projects multi-target, so
        # one `dotnet test` builds and runs every framework in a single invocation; a matrix axis
        # would multiply the jobs, fight the solution-wide test command, and split each suite's
        # results across jobs where the step below could no longer add them up.
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both bands the projects target, pinned rather than floating: a floating SDK turns an
          # unrelated toolchain change into a red build on this repo.
          #
          # The 10.0 SDK alone would compile net8.0 perfectly well — but it does not carry the
          # .NET 8 runtime, and the net8.0 half of the test run has to execute. Installing 8.0.x
          # is what makes that possible; dropping it would build green and fail at test time.
          dotnet-version: |
            8.0.x
            10.0.x
        # No `cache:` — that input needs NuGet lock files, which this repository does not use.

      - name: Restore
        run: dotnet restore

      # `TreatWarningsAsErrors` is set for every project in Directory.Build.props, so a warning
      # already fails a local build. `-warnaserror` is passed as well to cover warnings raised by
      # MSBuild and NuGet themselves, which that property does not reach.
      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # The whole solution is tested in one command on purpose. Naming the test projects one by one
      # means a suite added later is silently never run; asking for the solution means a new suite
      # is picked up the day it is added. It does not protect against the opposite — a suite
      # dropped from the solution, or skipped — which is what the step after this one checks.
      #
      # That matters most for the conformance suite, which asserts on the produced .pptx package —
      # its XML, its relationships, its content types and its schema validity — rather than on
      # values read back through the library. A test that calls the library to check the library
      # cannot see a writer defect at all.
      #
      # No --results-directory: each test project then writes its .trx under its own
      # TestResults folder. Pointed at one shared directory the three projects race for the same
      # generated file name, and the run that loses it is simply gone from the artefact.
      - name: Test
        run: >
          dotnet test Aspose.Slides.Foss.sln
          --no-build
          --configuration Release
          --verbosity normal
          --logger trx

      # The step above reports on the suites it found. It cannot report a suite that was not there
      # to be found: take the conformance project out of Aspose.Slides.Foss.sln, or put `Skip` on
      # its classes, and every step so far stays green while nothing asserts on a produced package
      # any more. Uploading the results does not close that either — it only proves some .trx
      # exists. So the .trx files are read back here, and each suite must be present, must have
      # failed nothing, and must have run at least the number of tests recorded in CONTRIBUTING.md.
      # Those numbers are floors: adding tests is expected and passes, losing them is what fails.
      #
      # THE PROJECTS MULTI-TARGET, SO EACH SUITE WRITES ONE .trx PER TARGET FRAMEWORK, and this
      # step reads all of them rather than the newest. Reading only the newest is what it used to
      # do, and under multi-targeting that is a check with a hole in the middle: one framework's
      # leg could stop running entirely and the count from the other would still clear the floor.
      # The floors are per suite across every framework, and the number of .trx files is asserted
      # too — a sum alone would still pass if a whole framework vanished and the survivor grew.
      #
      # pwsh rather than bash because this job also runs on Windows, and it is installed on all
      # three of GitHub's runner images.
      - name: Check that every suite ran
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Per suite: the floor across all target frameworks, and how many .trx files there must
          # be. The framework count comes from the project files, so adding a framework without
          # updating it here fails loudly rather than being averaged away.
          $expectedRuns = 2
          $floors = [ordered]@{
            'Aspose.Slides.Foss.Tests'            = 3908
            'Aspose.Slides.Foss.IntegrationTests' = 194
            'Aspose.Slides.Foss.ConformanceTests' = 160
          }
          $problems = @()
          foreach ($suite in $floors.Keys) {
            $floor = $floors[$suite]
            $dir = Join-Path 'tests' (Join-Path $suite 'TestResults')
            $trxFiles = @()
            if (Test-Path -LiteralPath $dir) {
              $trxFiles = @(Get-ChildItem -LiteralPath $dir -Filter '*.trx')
            }
            if ($trxFiles.Count -eq 0) {
              $problems += "$suite : no .trx under $dir - the suite did not run at all"
              continue
            }
            if ($trxFiles.Count -ne $expectedRuns) {
              $problems += "$suite : $($trxFiles.Count) .trx file(s), expected $expectedRuns - one per target framework"
            }
            $passed = 0
            $notPassed = 0
            $notRun = 0
            foreach ($trx in $trxFiles) {
              $counters = ([xml](Get-Content -Raw -LiteralPath $trx.FullName)).TestRun.ResultSummary.Counters
              $passed += [int]$counters.passed
              $notPassed += [int]$counters.failed + [int]$counters.error + [int]$counters.timeout + [int]$counters.aborted
              $notRun += [int]$counters.total - [int]$counters.executed
            }
            Write-Host ('{0,-36} runs {1}   passed {2,5}   not passed {3,4}   not executed {4,4}   floor {5}' -f $suite, $trxFiles.Count, $passed, $notPassed, $notRun, $floor)
            if ($notPassed -gt 0) {
              $problems += "$suite : $notPassed test(s) did not pass"
            }
            if ($passed -lt $floor) {
              $problems += "$suite : $passed tests passed across $($trxFiles.Count) run(s), fewer than the $floor recorded in CONTRIBUTING.md"
            }
          }
          if ($problems.Count -gt 0) {
            foreach ($problem in $problems) { Write-Host "FAILED  $problem" }
            exit 1
          }
          Write-Host 'Every suite ran, on every target framework, in full.'

      - name: Upload test results
        # Test results are most wanted exactly when the step above failed.
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: error

  package:
    name: Package
    # A package built from a revision that fails its own tests is not worth downloading.
    needs: test
    runs-on: ubuntu-latest

    # Exposed so a calling workflow can name the artefact and check the tag against the version
    # without deriving either a second time. A second source of truth for a version is how a tag and
    # a package come to disagree.
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_id: ${{ steps.version.outputs.package_id }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Both, for the same reason as in the test job: the consumer check below runs the
          # packaged assembly on each framework the package ships, and running net8.0 needs the
          # .NET 8 runtime present.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      # ContinuousIntegrationBuild is switched on by the GITHUB_ACTIONS environment variable, which
      # is set for every step here. It normalises source paths in the PDB so that Source Link
      # resolves them against this repository rather than against a build agent's directory.
      - name: Pack
        run: >
          dotnet pack src/Aspose.Slides.Foss
          --no-build
          --configuration Release
          --output ${{ github.workspace }}/artifacts/package

      # The version and the identifier are defined once, in the project files, and are asked of
      # MSBuild rather than parsed out of anything.
      #
      # This step used to read the version off the produced file name by stripping the package
      # identifier as a literal prefix. That could not survive the identifier changing: bash prefix
      # removal on a non-match returns the string unchanged, so the version silently became the
      # whole file name and the failure surfaced several steps later as a NuGet parse error naming
      # neither this step nor the rename. Asking MSBuild cannot fail that way.
      - name: Read the identity from the project
        id: version
        run: |
          set -euo pipefail
          version=$(dotnet msbuild src/Aspose.Slides.Foss -getProperty:Version | tr -d '[:space:]')
          package_id=$(dotnet msbuild src/Aspose.Slides.Foss -getProperty:PackageId | tr -d '[:space:]')
          test -n "$version"
          test -n "$package_id"
          # The package that was actually produced must be the one those two describe. If it is
          # not, everything downstream is operating on a file nobody asked for.
          test -f "artifacts/package/${package_id}.${version}.nupkg"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_id=$package_id" >> "$GITHUB_OUTPUT"
          echo "Packed $package_id $version"

      # Printed into the log so a reviewer can see what shipped without downloading anything, and
      # so a file that quietly stopped being packed — the readme, the licence, the XML docs — shows
      # up as a diff in the log of two runs. This is a listing and not a check; the checks are the
      # step below it.
      - name: List what is inside the package
        run: |
          set -euo pipefail
          for pkg in artifacts/package/*.nupkg artifacts/package/*.snupkg; do
            echo "== $pkg"
            unzip -l "$pkg"
          done

      # The listing above is for a human. This is the gate: it parses the generated .nuspec, checks
      # every field the package page is built from, asserts that each framework the manifest
      # declares actually carries an assembly and its documentation, and lints the packed readme
      # for the things nuget.org discards without failing — an image from a host outside its
      # allow-list, a relative link, a Mermaid fence, an install command naming a different
      # package. Every one of those would otherwise ship green and be visible only on the live
      # package page.
      - name: Check the package
        run: python3 .github/scripts/check_package.py artifacts/package/*.nupkg

      # Everything above this point tests the project. This tests the package: a throwaway console
      # app that resolves the package from the folder just packed, writes a presentation and reads
      # it back. A package can build cleanly and still be unusable — an assembly under a path no
      # consumer resolves, a target framework nothing matches — and only restoring it from a feed
      # shows that.
      #
      # It runs once per shipped framework, and the framework is pinned explicitly. Left to itself
      # `dotnet new console` takes the newest installed SDK's default, so the older `lib/` folder
      # would be asserted present by the step above and never actually resolved by anything. A
      # package can carry an assembly that no consumer on that framework can load.
      - name: Consume the package from a throwaway project
        # The version reaches the script through the environment rather than by being pasted into
        # it. It comes from a project property a pull request can edit, and interpolating one
        # straight into a shell is how that becomes command execution.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PACKAGE_ID: ${{ steps.version.outputs.package_id }}
        run: |
          set -euo pipefail
          for tfm in net8.0 net10.0; do
          echo "== consuming $PACKAGE_ID $VERSION on $tfm"
          work="$(mktemp -d)"
          cd "$work"
          dotnet new console --framework "$tfm" --output . > /dev/null
          cat > nuget.config <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="built-here" value="$GITHUB_WORKSPACE/artifacts/package" />
            </packageSources>
          </configuration>
          XML
          cat > Program.cs <<'CSHARP'
          using System.IO.Compression;
          using System.Xml.Linq;
          using Aspose.Slides.Foss;
          using Aspose.Slides.Foss.Export;

          using (var prs = new Presentation())
          {
              var shape = prs.Slides[0].Shapes!.AddAutoShape(ShapeType.Rectangle, 10, 10, 200, 60);
              shape.AddTextFrame("packaged");
              prs.Save("smoke.pptx", SaveFormat.Pptx);
          }

          // Asserted against the XML inside the file that was produced, never against what the
          // library says when asked to read its own output back. A writer that emits the wrong
          // thing and a reader that reads it back agree with each other, and both pass.
          using var package = ZipFile.OpenRead("smoke.pptx");
          var presentationPart = package.GetEntry("ppt/presentation.xml")
              ?? throw new Exception("the package produced a file with no ppt/presentation.xml");
          var p = XNamespace.Get("http://schemas.openxmlformats.org/presentationml/2006/main");
          var slideIds = XDocument.Load(presentationPart.Open())
              .Descendants(p + "sldId").Count();
          if (slideIds != 1)
          {
              throw new Exception($"expected one registered slide, the file declares {slideIds}");
          }

          Console.WriteLine($"wrote smoke.pptx: {new FileInfo("smoke.pptx").Length} bytes, "
              + $"{package.Entries.Count} parts, {slideIds} registered slide(s)");
          CSHARP
          dotnet add package "$PACKAGE_ID" --version "$VERSION"
          dotnet run --configuration Release
          cd - > /dev/null
          done

      # A machine-readable dependency list, in CycloneDX form. Two of them: one for the package
      # that ships, whose dependency list is the thing a consumer inherits, and one for the whole
      # solution, which additionally covers the test-only packages that go into deciding whether
      # this revision is good. The generator is a local tool pinned by .config/dotnet-tools.json.
      - name: Restore local tools
        run: dotnet tool restore

      - name: Generate SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet dotnet-CycloneDX src/Aspose.Slides.Foss/Aspose.Slides.Foss.csproj \
            --output "$GITHUB_WORKSPACE/artifacts/sbom" \
            --filename Aspose.Slides.FOSS.cdx.json \
            --output-format Json \
            --set-name Aspose.Slides.FOSS \
            --set-version "$VERSION" \
            --set-type Library \
            --exclude-test-projects
          dotnet dotnet-CycloneDX Aspose.Slides.Foss.sln \
            --output "$GITHUB_WORKSPACE/artifacts/sbom" \
            --filename solution.cdx.json \
            --output-format Json \
            --set-name Aspose.Slides.Foss.sln \
            --set-version "$VERSION"

      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package-${{ steps.version.outputs.version }}
          path: |
            artifacts/package/*.nupkg
            artifacts/package/*.snupkg
          if-no-files-found: error

      - name: Upload the SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ steps.version.outputs.version }}
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error
